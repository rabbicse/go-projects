version: "3.9"

# Full-stack deployment.
#
# make up           → build + start everything (databases, backend, frontend, monitoring)
# make dev-up       → databases only (backend + frontend run locally via make run / npm run dev)
# make monitoring-up → databases + Prometheus + Grafana only

services:
  redis:
    image: redis:7-alpine
    container_name: mtb-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: mtb-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: movie_ticket_booking
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Application ──────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
    container_name: mtb-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      GIN_MODE: release
      REDIS_ADDR: redis:6379
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: movie_ticket_booking
      MAX_SEATS_PER_SESSION: "4"
      HOLD_TTL: 10m
      # Override ADMIN_USER and ADMIN_PASSWORD in production.
      ADMIN_USER: admin
      ADMIN_PASSWORD: changeme
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_API_URL is baked into the Next.js build at image build time.
        # It must point to the backend as seen from inside the Docker network.
        NEXT_PUBLIC_API_URL: http://backend:8080
        NEXT_PUBLIC_MAX_SEATS: "4"
    container_name: mtb-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  # ── Monitoring ───────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: mtb-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    # Linux only: lets "host.docker.internal" resolve to the Docker host so
    # Prometheus can reach the backend running outside Docker.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:latest
    container_name: mtb-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_healthy

volumes:
  redis_data:
  mongo_data:
  grafana_data:
